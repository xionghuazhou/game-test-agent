name: Feature request
description: Suggest a focused improvement for Game Test Agent
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What game-testing problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
      description: Describe the expected result and how it can be tested.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered